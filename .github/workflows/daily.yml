name: 地球日記

on:
  schedule:
    - cron: "3 10 * * *"   # 毎晩 19:03（日本時間）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  write:
    name: 日記を書く
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: pip install -r requirements.txt
      - name: 書く（投稿はまだ）
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m earth_diary.main write
      - name: 日記をリポジトリに残す
        run: |
          git config user.name "earth-diary"
          git config user.email "earth-diary@users.noreply.github.com"
          git add diary/*.md data
          git commit -m "地球日記 $(TZ=Asia/Tokyo date +%F)" || echo "変更なし"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: earth-diary
          path: outbox/
          retention-days: 7

  post:
    name: 承認されたらXに投稿
    needs: write
    runs-on: ubuntu-latest
    environment: x-post        # ここで又七の承認を待つ
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: earth-diary
          path: outbox/
      - name: 投稿
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: python -m earth_diary.main post
