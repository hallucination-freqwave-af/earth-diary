name: 地球日記
run-name: 地球日記 ${{ github.event_name == 'workflow_dispatch' && '（手で回した分）' || '' }}

on:
  schedule:
    - cron: "3 10 * * *"   # 毎晩 19:03（日本時間）
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  write:
    name: 日記を書く
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: pip install -r requirements.txt
      - name: 書く（投稿はまだ）
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m earth_diary.main write
      - name: 日記をリポジトリに残す
        run: |
          git config user.name "earth-diary"
          git config user.email "earth-diary@users.noreply.github.com"
          git add diary/*.md data
          git commit -m "地球日記 $(TZ=Asia/Tokyo date +%F)" || echo "変更なし"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: earth-diary
          path: outbox/
          retention-days: 7
      - name: 承認のメールを出す（本文入りのIssue。okと返信したら投稿）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create earth-diary --color 0e8a16 --description "地球日記の承認待ち" --force
          # 前の晩の承認待ちが残っていたら閉じる（もう投稿しない）
          for n in $(gh issue list --label earth-diary --state open --json number --jq '.[].number'); do
            gh issue close "$n" --comment "新しい日記が来たので、この日は投稿せずに閉じます。"
          done
          echo "" >> outbox/issue.md
          echo "<!-- run:${{ github.run_id }} -->" >> outbox/issue.md
          gh issue create --title "$(cat outbox/issue_title.txt)" --body-file outbox/issue.md --label earth-diary --assignee "${{ github.repository_owner }}"
